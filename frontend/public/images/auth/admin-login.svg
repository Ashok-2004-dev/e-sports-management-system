<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#1d1138"/>
    </linearGradient>
    <radialGradient id="aViolet" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aCyan" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#a28bff"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17152e" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0c0d18" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="hexOps" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M15 0 L45 0 L60 26 L45 52 L15 52 L0 26 Z" fill="none" stroke="#7c5cff" stroke-width="0.7" stroke-opacity="0.14"/>
    </pattern>
    <filter id="aGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="900" rx="28" fill="url(#aBg)"/>
  <rect width="800" height="900" rx="28" fill="url(#hexOps)"/>
  <rect width="800" height="900" rx="28" fill="url(#aViolet)"/>
  <rect width="800" height="900" rx="28" fill="url(#aCyan)"/>

  <!-- Frame -->
  <rect x="24" y="24" width="752" height="852" rx="20" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M 24 84 L 24 24 L 84 24" fill="none" stroke="#a28bff" stroke-width="3"/>
  <path d="M 716 24 L 776 24 L 776 84" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <path d="M 24 816 L 24 876 L 84 876" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <path d="M 716 876 L 776 876 L 776 816" fill="none" stroke="#a28bff" stroke-width="3"/>

  <!-- Top Security Header Pill -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="210" height="34" rx="17" fill="#7c5cff" fill-opacity="0.18" stroke="#a28bff" stroke-opacity="0.5"/>
    <circle cx="18" cy="17" r="5" fill="#a3e635"/>
    <rect x="34" y="13" width="96" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.85"/>
    <rect x="138" y="13" width="48" height="8" rx="4" fill="#a3e635" fill-opacity="0.8"/>

    <!-- Server Status Nodes -->
    <g transform="translate(612, 7)">
      <circle cx="10" cy="10" r="6" fill="#22d3ee"/>
      <circle cx="30" cy="10" r="6" fill="#7c5cff"/>
      <circle cx="50" cy="10" r="6" fill="#a3e635"/>
      <rect x="64" y="6" width="24" height="8" rx="4" fill="#94a3b8" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- Central Command Shield & Tactical Telemetry -->
  <g transform="translate(400, 345)">
    <circle cx="0" cy="0" r="218" fill="none" stroke="#7c5cff" stroke-width="1" stroke-opacity="0.32"/>
    <circle cx="0" cy="0" r="182" fill="none" stroke="#a28bff" stroke-width="1.5" stroke-dasharray="6 12" stroke-opacity="0.48"/>
    <circle cx="0" cy="0" r="146" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.28"/>

    <!-- Crosshairs -->
    <line x1="-232" y1="0" x2="-192" y2="0" stroke="#7c5cff" stroke-width="2.5"/>
    <line x1="192" y1="0" x2="232" y2="0" stroke="#7c5cff" stroke-width="2.5"/>
    <line x1="0" y1="-232" x2="0" y2="-192" stroke="#22d3ee" stroke-width="2.5"/>
    <line x1="0" y1="192" x2="0" y2="232" stroke="#22d3ee" stroke-width="2.5"/>

    <!-- Main Admin Security Shield -->
    <path d="M 0 -118 L 96 -78 L 96 6 C 96 68, 52 108, 0 130 C -52 108, -96 68, -96 6 L -96 -78 Z"
          fill="#12142b" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#aGlow)"/>
    <path d="M 0 -98 L 78 -65 L 78 4 C 78 55, 42 89, 0 108 C -42 89, -78 55, -78 4 L -78 -65 Z"
          fill="#191c3a" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Crown + Verified Check -->
    <path d="M -36 -18 L -22 -42 L 0 -24 L 22 -42 L 36 -18 Z" fill="#a28bff" opacity="0.95"/>
    <rect x="-36" y="-12" width="72" height="8" rx="4" fill="#22d3ee"/>
    <path d="M -24 28 L -6 46 L 30 10" fill="none" stroke="#a3e635" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Floating Node: Bracket Tree -->
    <g transform="translate(-176, -72)">
      <rect x="-58" y="-38" width="116" height="76" rx="14" fill="#13152c" stroke="#22d3ee" stroke-width="1.8"/>
      <path d="M -36 -16 H -12 V 0 H 10 M -36 16 H -12 V 0" fill="none" stroke="#22d3ee" stroke-width="2.8"/>
      <circle cx="24" cy="0" r="7.5" fill="#a3e635"/>
      <rect x="-36" y="24" width="72" height="5" rx="2.5" fill="#94a3b8" fill-opacity="0.45"/>
    </g>

    <!-- Right Floating Node: Live Stream Broadcast Ops -->
    <g transform="translate(176, 68)">
      <rect x="-62" y="-38" width="124" height="76" rx="14" fill="#13152c" stroke="#ff2e4d" stroke-width="1.8"/>
      <circle cx="-32" cy="-10" r="6.5" fill="#ff2e4d"/>
      <rect x="-18" y="-14" width="56" height="8" rx="4" fill="#ffffff" fill-opacity="0.9"/>
      <rect x="-38" y="8" width="76" height="6" rx="3" fill="#7c5cff"/>
      <rect x="-38" y="20" width="48" height="5" rx="2.5" fill="#22d3ee" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- Two Visual Admin Control Modules (Telemetry Bars & Status Indicators) -->
  <g transform="translate(56, 610)">
    <!-- Module 1: Tournament & Bracket Ops -->
    <rect x="0" y="0" width="334" height="118" rx="16" fill="url(#panelBg)" stroke="#7c5cff" stroke-opacity="0.45"/>
    <circle cx="34" cy="34" r="14" fill="#7c5cff" fill-opacity="0.22"/>
    <path d="M 27 28 H 34 V 34 H 41 M 27 40 H 34 V 34" fill="none" stroke="#a28bff" stroke-width="2.2"/>
    <rect x="58" y="26" width="130" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.9"/>
    <rect x="58" y="40" width="84" height="5" rx="2.5" fill="#a28bff" fill-opacity="0.7"/>
    <rect x="22" y="68" width="290" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="22" y="68" width="232" height="7" rx="3.5" fill="#7c5cff"/>
    <rect x="22" y="88" width="180" height="6" rx="3" fill="#64748b" fill-opacity="0.45"/>
    <circle cx="298" cy="91" r="6" fill="#a3e635"/>

    <!-- Module 2: Live Match & Stream Control -->
    <rect x="354" y="0" width="334" height="118" rx="16" fill="url(#panelBg)" stroke="#22d3ee" stroke-opacity="0.4"/>
    <circle cx="388" cy="34" r="14" fill="#22d3ee" fill-opacity="0.18"/>
    <circle cx="388" cy="34" r="6" fill="#ff2e4d"/>
    <rect x="412" y="26" width="142" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.9"/>
    <rect x="412" y="40" width="92" height="5" rx="2.5" fill="#22d3ee" fill-opacity="0.75"/>
    <rect x="376" y="68" width="290" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="376" y="68" width="254" height="7" rx="3.5" fill="#22d3ee"/>
    <rect x="376" y="88" width="196" height="6" rx="3" fill="#64748b" fill-opacity="0.45"/>
    <circle cx="652" cy="91" r="6" fill="#22d3ee"/>
  </g>
</svg>