<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#101629"/>
      <stop offset="100%" stop-color="#1a1238"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="28%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="76%" cy="72%" r="60%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a28bff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161d30" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0c101c" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-width="0.6" stroke-opacity="0.1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="900" rx="28" fill="url(#pBg)"/>
  <rect width="800" height="900" rx="28" fill="url(#techGrid)"/>
  <rect width="800" height="900" rx="28" fill="url(#cyanGlow)"/>
  <rect width="800" height="900" rx="28" fill="url(#violetGlow)"/>

  <!-- Outer HUD Frame -->
  <rect x="24" y="24" width="752" height="852" rx="20" fill="none" stroke="url(#neonStroke)" stroke-width="1.5" stroke-opacity="0.45"/>
  <path d="M 24 84 L 24 24 L 84 24" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <path d="M 716 24 L 776 24 L 776 84" fill="none" stroke="#7c5cff" stroke-width="3"/>
  <path d="M 24 816 L 24 876 L 84 876" fill="none" stroke="#7c5cff" stroke-width="3"/>
  <path d="M 716 876 L 776 876 L 776 816" fill="none" stroke="#22d3ee" stroke-width="3"/>

  <!-- Top Telemetry Pill & Signal Bars -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="184" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="18" cy="17" r="5" fill="#22d3ee"/>
    <rect x="34" y="13" width="84" height="8" rx="4" fill="#22d3ee" fill-opacity="0.85"/>
    <rect x="126" y="13" width="38" height="8" rx="4" fill="#a28bff" fill-opacity="0.75"/>

    <!-- Ping / FPS Signal Bars -->
    <g transform="translate(612, 6)">
      <rect x="0" y="14" width="6" height="8" rx="2" fill="#22d3ee"/>
      <rect x="10" y="10" width="6" height="12" rx="2" fill="#22d3ee"/>
      <rect x="20" y="6" width="6" height="16" rx="2" fill="#22d3ee"/>
      <rect x="30" y="2" width="6" height="20" rx="2" fill="#a3e635"/>
      <rect x="46" y="8" width="30" height="8" rx="4" fill="#94a3b8" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- Central Arena Rings & Pro Player Emblem -->
  <g transform="translate(400, 345)">
    <circle cx="0" cy="0" r="220" fill="none" stroke="#7c5cff" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="184" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="14 10" stroke-opacity="0.42"/>
    <circle cx="0" cy="0" r="146" fill="#0d1222" fill-opacity="0.78" stroke="url(#neonStroke)" stroke-width="2.2"/>

    <!-- Pro Gamer Silhouette -->
    <path d="M -100 114 C -94 64, -52 46, 0 46 C 52 46, 94 64, 100 114 Z" fill="#182038" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M -40 48 L 0 86 L 40 48" fill="none" stroke="#7c5cff" stroke-width="2.5"/>
    <polygon points="0,92 -10,104 0,116 10,104" fill="#22d3ee"/>

    <rect x="-18" y="22" width="36" height="30" rx="8" fill="#13192c"/>

    <!-- Headset Band -->
    <path d="M -68 -14 C -68 -76, 68 -76, 68 -14" fill="none" stroke="#7c5cff" stroke-width="10" stroke-linecap="round"/>
    <path d="M -64 -16 C -64 -72, 64 -72, 64 -16" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

    <!-- Helmet Contour -->
    <path d="M -52 -16 C -52 -58, 52 -58, 52 -16 L 46 22 C 34 38, -34 38, -46 22 Z" fill="#141a2e" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Glowing Cyber Visor -->
    <path d="M -44 -14 L 44 -14 L 38 8 L 8 12 L 0 6 L -8 12 L -38 8 Z" fill="url(#visorGrad)" filter="url(#glow)"/>
    <path d="M -34 -8 L 34 -8" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.75" stroke-linecap="round"/>

    <!-- Headset Ear Cups & Mic -->
    <rect x="-76" y="-26" width="20" height="46" rx="8" fill="#1e2642" stroke="#22d3ee" stroke-width="2"/>
    <rect x="56" y="-26" width="20" height="46" rx="8" fill="#1e2642" stroke="#22d3ee" stroke-width="2"/>
    <path d="M -66 16 Q -52 36 -18 32" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-16" cy="32" r="4" fill="#f43f5e"/>

    <!-- Floating Controller Badge -->
    <g transform="translate(132, 118) rotate(-10)">
      <rect x="-48" y="-30" width="96" height="60" rx="18" fill="#13192e" stroke="#22d3ee" stroke-width="2"/>
      <path d="M -24 -8 V 8 M -32 0 H -16" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="22" cy="-7" r="4.5" fill="#a28bff"/>
      <circle cx="33" cy="1" r="4.5" fill="#22d3ee"/>
      <circle cx="22" cy="9" r="4.5" fill="#f43f5e"/>
      <circle cx="11" cy="1" r="4.5" fill="#a3e635"/>
    </g>

    <!-- Floating Championship Trophy Badge -->
    <g transform="translate(-134, -112) rotate(8)">
      <rect x="-36" y="-36" width="72" height="72" rx="18" fill="#13192e" stroke="#7c5cff" stroke-width="2"/>
      <path d="M -15 -15 H 15 V -2 C 15 9, -15 9, -15 -2 Z" fill="#fbbf24"/>
      <path d="M -15 -10 H -21 C -21 0, -15 3, -15 3 M 15 -10 H 21 C 21 0, 15 3, 15 3" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <rect x="-4" y="6" width="8" height="9" fill="#fbbf24"/>
      <rect x="-13" y="15" width="26" height="4.5" rx="2" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Three Visual Feature Cards (Icon + Progress Telemetry Bars) -->
  <g transform="translate(56, 610)">
    <!-- Card 1: Tournaments -->
    <rect x="0" y="0" width="216" height="118" rx="16" fill="url(#cardGrad)" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle cx="34" cy="34" r="14" fill="#22d3ee" fill-opacity="0.16"/>
    <path d="M 28 29 H 40 V 35 C 40 39, 28 39, 28 35 Z" fill="#22d3ee"/>
    <rect x="58" y="29" width="90" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.85"/>
    <rect x="20" y="62" width="176" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="62" width="136" height="6" rx="3" fill="#22d3ee"/>
    <rect x="20" y="80" width="110" height="6" rx="3" fill="#64748b" fill-opacity="0.5"/>
    <rect x="20" y="96" width="64" height="4" rx="2" fill="#22d3ee"/>

    <!-- Card 2: Squad / Teams -->
    <rect x="236" y="0" width="216" height="118" rx="16" fill="url(#cardGrad)" stroke="#7c5cff" stroke-opacity="0.4"/>
    <circle cx="270" cy="34" r="14" fill="#7c5cff" fill-opacity="0.2"/>
    <circle cx="266" cy="32" r="4" fill="#a28bff"/>
    <circle cx="275" cy="32" r="4" fill="#22d3ee"/>
    <path d="M 260 41 C 260 37, 280 37, 280 41" fill="none" stroke="#a28bff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="294" y="29" width="96" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.85"/>
    <rect x="256" y="62" width="176" height="6" rx="3" fill="#1e293b"/>
    <rect x="256" y="62" width="152" height="6" rx="3" fill="#7c5cff"/>
    <rect x="256" y="80" width="124" height="6" rx="3" fill="#64748b" fill-opacity="0.5"/>
    <rect x="256" y="96" width="64" height="4" rx="2" fill="#7c5cff"/>

    <!-- Card 3: Leaderboard Rank -->
    <rect x="472" y="0" width="216" height="118" rx="16" fill="url(#cardGrad)" stroke="#f43f5e" stroke-opacity="0.35"/>
    <circle cx="506" cy="34" r="14" fill="#f43f5e" fill-opacity="0.18"/>
    <polygon points="506,24 509,31 516,31 510,36 512,43 506,38 500,43 502,36 496,31 503,31" fill="#fbbf24"/>
    <rect x="530" y="29" width="88" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.85"/>
    <rect x="492" y="62" width="176" height="6" rx="3" fill="#1e293b"/>
    <rect x="492" y="62" width="160" height="6" rx="3" fill="#f43f5e"/>
    <rect x="492" y="80" width="102" height="6" rx="3" fill="#64748b" fill-opacity="0.5"/>
    <rect x="492" y="96" width="64" height="4" rx="2" fill="#f43f5e"/>
  </g>
</svg>